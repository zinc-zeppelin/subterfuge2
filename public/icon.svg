<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tactical Dark Carbon Baseplate -->
  <rect x="2" y="2" width="60" height="60" rx="4" fill="#08080a" stroke="#27272a" stroke-width="2"/>
  
  <!-- Corner Calibration Brackets (Military Dossier Stamp) -->
  <path d="M 6 15 L 6 6 L 15 6" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="square"/>
  <path d="M 49 6 L 58 6 L 58 15" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="square"/>
  <path d="M 6 49 L 6 58 L 15 58" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="square"/>
  <path d="M 49 58 L 58 58 L 58 49" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="square"/>

  <!-- Radar / Cryptographic Reticle Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>

  <!-- Cardinal Intercept Crosshairs (Crimson Top/Bottom, Intel Blue Left/Right) -->
  <line x1="32" y1="4" x2="32" y2="15" stroke="#ef4444" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="32" y1="49" x2="32" y2="60" stroke="#ef4444" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="4" y1="32" x2="15" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="square"/>
  <line x1="49" y1="32" x2="60" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="square"/>

  <!-- Classified Intelligence 4-Point Cipher Star -->
  <path d="M 32 15 L 36.5 27.5 L 49 32 L 36.5 36.5 L 32 49 L 27.5 36.5 L 15 32 L 27.5 27.5 Z" fill="#f59e0b"/>

  <!-- Inner Surveillance Aperture / Black Core -->
  <circle cx="32" cy="32" r="6.5" fill="#08080a" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Classified Crimson Active Operative Core -->
  <circle cx="32" cy="32" r="3" fill="#ef4444"/>
</svg>
